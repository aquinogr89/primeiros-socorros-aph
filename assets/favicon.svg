  <rect x="8" y="47" width="48" height="5" rx="2.5" ry="2.5" fill="#FFB511"/>
  <text x="32" y="31" font-family="sans-serif" font-size="24" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="0.5">APH</text>
  <text x="32" y="42" font-family="sans-serif" font-size="9" font-weight="400"
        fill="#cfd8ee" text-anchor="middle" letter-spacing="0.6">SALVAR VIDAS</text>
</svg>
